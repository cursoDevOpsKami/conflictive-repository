<!DOCTYPE html>
<html>
<body>

<h1>Frontend</h1>

<button onclick="callApi()">Llamar backend</button>

<p id="result"></p>

<script>
function callApi(){
    fetch("/api")
    .then(res => res.text())
    .then(data => {
        document.getElementById("result").innerText = data
    })
}
</script>

</body>
</html>
